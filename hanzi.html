<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>三年级汉字练习</title>
  <style>
    :root {
      --ink: #1f2528;
      --muted: #657074;
      --line: #d9e0df;
      --paper: #fffdf7;
      --jade: #1f7a6a;
      --jade-2: #dff1ec;
      --sun: #f4b23d;
      --coral: #de6954;
      --sky: #3e7da8;
      --lilac: #7b6fc2;
      --shadow: 0 16px 44px rgba(30, 47, 50, 0.12);
      color-scheme: light;
      font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", system-ui, sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background:
        radial-gradient(circle at 16px 16px, rgba(31, 122, 106, 0.12) 2px, transparent 3px) 0 0 / 34px 34px,
        linear-gradient(135deg, #f8fbf9 0%, #fff7e5 48%, #edf6f2 100%);
    }

    button, input, select {
      font: inherit;
    }

    button {
      border: 0;
      cursor: pointer;
    }

    .app {
      min-height: 100vh;
      display: grid;
      grid-template-columns: 260px 1fr;
    }

    .sidebar {
      min-height: 100vh;
      padding: 22px 18px;
      background: rgba(255, 253, 247, 0.88);
      border-right: 1px solid rgba(31, 37, 40, 0.1);
      backdrop-filter: blur(12px);
      position: sticky;
      top: 0;
      align-self: start;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 22px;
    }

    .seal {
      width: 48px;
      aspect-ratio: 1;
      display: grid;
      place-items: center;
      color: #fff;
      background: var(--coral);
      border-radius: 8px;
      font-size: 26px;
      font-weight: 800;
      box-shadow: 0 10px 22px rgba(222, 105, 84, 0.22);
    }

    .brand h1 {
      margin: 0;
      font-size: 20px;
      line-height: 1.2;
    }

    .brand p {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 13px;
    }

    .nav {
      display: grid;
      gap: 8px;
      margin-bottom: 20px;
    }

    .nav button,
    .choice,
    .tool,
    .primary,
    .ghost {
      min-height: 42px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: transform 150ms ease, background 150ms ease, box-shadow 150ms ease;
    }

    .nav button {
      justify-content: flex-start;
      padding: 0 13px;
      color: var(--ink);
      background: transparent;
      font-weight: 700;
    }

    .nav button.active {
      color: #fff;
      background: var(--jade);
      box-shadow: 0 12px 28px rgba(31, 122, 106, 0.2);
    }

    .nav button:hover,
    .tool:hover,
    .primary:hover,
    .ghost:hover,
    .choice:hover {
      transform: translateY(-1px);
    }

    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 18px;
    }

    .stat {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 12px;
    }

    .stat strong {
      display: block;
      font-size: 22px;
      line-height: 1;
      margin-bottom: 6px;
    }

    .stat span {
      color: var(--muted);
      font-size: 12px;
    }

    .filters {
      display: grid;
      gap: 10px;
    }

    .field {
      display: grid;
      gap: 6px;
    }

    .field label {
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
    }

    .field input,
    .field select {
      width: 100%;
      min-height: 40px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      color: var(--ink);
      padding: 0 10px;
      outline: 0;
    }

    .field input:focus,
    .field select:focus {
      border-color: var(--jade);
      box-shadow: 0 0 0 3px rgba(31, 122, 106, 0.14);
    }

    main {
      padding: 24px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 18px;
    }

    .topbar h2 {
      margin: 0;
      font-size: clamp(24px, 4vw, 42px);
      line-height: 1.08;
    }

    .topbar p {
      margin: 7px 0 0;
      color: var(--muted);
      max-width: 680px;
    }

    .date-chip {
      flex: 0 0 auto;
      background: rgba(255, 255, 255, 0.72);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 10px 12px;
      font-weight: 800;
    }

    .panel {
      display: none;
    }

    .panel.active {
      display: block;
    }

    .learn-layout {
      display: grid;
      grid-template-columns: minmax(320px, 520px) minmax(280px, 1fr);
      gap: 18px;
      align-items: start;
    }

    .hanzi-stage {
      background: var(--paper);
      border: 1px solid rgba(31, 37, 40, 0.12);
      border-radius: 8px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .stage-art {
      height: 130px;
      background:
        linear-gradient(90deg, rgba(31, 122, 106, 0.92), rgba(62, 125, 168, 0.86)),
        repeating-linear-gradient(90deg, transparent 0 38px, rgba(255,255,255,0.18) 38px 40px);
      position: relative;
    }

    .stage-art::before,
    .stage-art::after {
      content: "";
      position: absolute;
      inset: 22px auto auto 26px;
      width: 120px;
      height: 70px;
      border: 2px solid rgba(255,255,255,0.58);
      border-left: 0;
      border-right: 0;
      transform: skewX(-12deg);
    }

    .stage-art::after {
      left: auto;
      right: 30px;
      width: 96px;
      height: 96px;
      border: 3px solid rgba(255,255,255,0.46);
      border-radius: 50%;
      transform: none;
    }

    .big-card {
      padding: 22px;
      display: grid;
      grid-template-columns: minmax(160px, 220px) 1fr;
      gap: 20px;
      align-items: center;
    }

    .character-box {
      aspect-ratio: 1;
      min-width: 160px;
      background:
        linear-gradient(45deg, transparent calc(50% - 1px), rgba(222, 105, 84, 0.28) calc(50% - 1px), rgba(222, 105, 84, 0.28) calc(50% + 1px), transparent calc(50% + 1px)),
        linear-gradient(-45deg, transparent calc(50% - 1px), rgba(222, 105, 84, 0.28) calc(50% - 1px), rgba(222, 105, 84, 0.28) calc(50% + 1px), transparent calc(50% + 1px)),
        linear-gradient(90deg, transparent calc(50% - 1px), rgba(31, 122, 106, 0.2) calc(50% - 1px), rgba(31, 122, 106, 0.2) calc(50% + 1px), transparent calc(50% + 1px)),
        linear-gradient(0deg, transparent calc(50% - 1px), rgba(31, 122, 106, 0.2) calc(50% - 1px), rgba(31, 122, 106, 0.2) calc(50% + 1px), transparent calc(50% + 1px)),
        #fff;
      border: 2px solid #d74f3e;
      border-radius: 8px;
      display: grid;
      place-items: center;
      box-shadow: inset 0 0 0 8px rgba(215, 79, 62, 0.05);
    }

    .character {
      font-family: "KaiTi", "STKaiti", "SimSun", serif;
      font-size: clamp(92px, 13vw, 152px);
      line-height: 1;
    }

    .character.masked {
      color: transparent;
      position: relative;
      text-shadow: none;
    }

    .character.masked::after {
      content: "?";
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      color: var(--muted);
      font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
      font-size: 0.58em;
      font-weight: 900;
    }

    .hanzi-info h3 {
      margin: 0 0 6px;
      font-size: 34px;
    }

    .pinyin {
      color: var(--coral);
      font-size: 24px;
      font-weight: 800;
      margin-bottom: 10px;
    }

    .meaning {
      color: var(--muted);
      line-height: 1.7;
      margin-bottom: 12px;
    }

    .tag-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 12px 0;
    }

    .tag {
      display: inline-flex;
      align-items: center;
      min-height: 30px;
      padding: 0 10px;
      border-radius: 999px;
      background: var(--jade-2);
      color: #185d52;
      font-weight: 800;
      font-size: 13px;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 14px;
    }

    .primary {
      min-width: 116px;
      padding: 0 14px;
      color: #fff;
      background: var(--jade);
      font-weight: 800;
      box-shadow: 0 10px 22px rgba(31, 122, 106, 0.2);
    }

    .ghost,
    .tool {
      min-width: 42px;
      padding: 0 13px;
      color: var(--ink);
      background: #fff;
      border: 1px solid var(--line);
      font-weight: 800;
    }

    .detail-grid {
      display: grid;
      gap: 14px;
    }

    .box {
      background: rgba(255,255,255,0.82);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 16px;
    }

    .box h3 {
      margin: 0 0 12px;
      font-size: 18px;
    }

    .word-list,
    .sentence-list {
      display: grid;
      gap: 9px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .word-list li,
    .sentence-list li {
      background: #fff;
      border: 1px solid rgba(31, 37, 40, 0.08);
      border-radius: 8px;
      padding: 10px 12px;
      line-height: 1.6;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(94px, 1fr));
      gap: 12px;
    }

    .unit-group {
      margin-bottom: 20px;
    }

    #charGrid.grid {
      display: block;
    }

    .unit-group h3 {
      margin: 0 0 10px;
      font-size: 20px;
    }

    .tile {
      min-height: 112px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      display: grid;
      place-items: center;
      padding: 10px;
      position: relative;
      box-shadow: 0 8px 20px rgba(30, 47, 50, 0.07);
    }

    .tile .mini-char {
      font-family: "KaiTi", "STKaiti", serif;
      font-size: 48px;
      line-height: 1;
    }

    .tile .mini-pinyin {
      color: var(--muted);
      font-size: 13px;
      font-weight: 800;
    }

    .tile.learned::after {
      content: "✓";
      position: absolute;
      top: 8px;
      right: 8px;
      width: 24px;
      aspect-ratio: 1;
      display: grid;
      place-items: center;
      border-radius: 50%;
      color: #fff;
      background: var(--jade);
      font-weight: 900;
    }

    .quiz-card {
      max-width: 760px;
      background: var(--paper);
      border: 1px solid rgba(31, 37, 40, 0.12);
      border-radius: 8px;
      box-shadow: var(--shadow);
      padding: 22px;
    }

    .quiz-prompt {
      display: grid;
      grid-template-columns: 150px 1fr;
      gap: 18px;
      align-items: center;
      margin-bottom: 18px;
    }

    .quiz-char {
      aspect-ratio: 1;
      display: grid;
      place-items: center;
      background: #fff;
      border: 2px solid var(--jade);
      border-radius: 8px;
      font-family: "KaiTi", "STKaiti", serif;
      font-size: 86px;
    }

    .quiz-prompt h3 {
      margin: 0 0 8px;
      font-size: 24px;
    }

    .choices {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .choice {
      background: #fff;
      border: 1px solid var(--line);
      min-height: 54px;
      padding: 0 12px;
      color: var(--ink);
      font-weight: 800;
    }

    .choice.correct {
      color: #fff;
      background: var(--jade);
      border-color: var(--jade);
    }

    .choice.wrong {
      color: #fff;
      background: var(--coral);
      border-color: var(--coral);
    }

    .feedback {
      min-height: 28px;
      margin-top: 12px;
      color: var(--muted);
      font-weight: 800;
    }

    .mode-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 0 0 16px;
    }

    .mode-tabs button {
      min-height: 36px;
      padding: 0 12px;
      border-radius: 8px;
      background: #fff;
      color: var(--ink);
      border: 1px solid var(--line);
      font-weight: 800;
    }

    .mode-tabs button.active {
      color: #fff;
      background: var(--sky);
      border-color: var(--sky);
    }

    .shape-card {
      background: var(--paper);
      border: 1px solid rgba(31, 37, 40, 0.12);
      border-radius: 8px;
      box-shadow: var(--shadow);
      padding: 22px;
    }

    .shape-stage {
      display: grid;
      grid-template-columns: minmax(150px, 220px) 1fr;
      gap: 20px;
      align-items: center;
      margin-bottom: 18px;
    }

    .shape-options {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
    }

    .shape-options .choice {
      min-height: 70px;
      font-size: 28px;
      font-family: "KaiTi", "STKaiti", "SimSun", serif;
    }

    .shape-options .choice.text-choice {
      font-family: inherit;
      font-size: 18px;
    }

    .clue-list {
      display: grid;
      gap: 9px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .clue-list li {
      background: #fff;
      border: 1px solid rgba(31, 37, 40, 0.08);
      border-radius: 8px;
      padding: 10px 12px;
      line-height: 1.6;
    }

    .write-layout {
      display: grid;
      grid-template-columns: minmax(300px, 520px) minmax(260px, 1fr);
      gap: 18px;
      align-items: start;
    }

    .write-pad {
      background: var(--paper);
      border: 1px solid rgba(31, 37, 40, 0.12);
      border-radius: 8px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .canvas-wrap {
      aspect-ratio: 1;
      background:
        linear-gradient(45deg, transparent calc(50% - 1px), rgba(222, 105, 84, 0.25) calc(50% - 1px), rgba(222, 105, 84, 0.25) calc(50% + 1px), transparent calc(50% + 1px)),
        linear-gradient(-45deg, transparent calc(50% - 1px), rgba(222, 105, 84, 0.25) calc(50% - 1px), rgba(222, 105, 84, 0.25) calc(50% + 1px), transparent calc(50% + 1px)),
        linear-gradient(90deg, transparent calc(50% - 1px), rgba(31, 122, 106, 0.18) calc(50% - 1px), rgba(31, 122, 106, 0.18) calc(50% + 1px), transparent calc(50% + 1px)),
        linear-gradient(0deg, transparent calc(50% - 1px), rgba(31, 122, 106, 0.18) calc(50% - 1px), rgba(31, 122, 106, 0.18) calc(50% + 1px), transparent calc(50% + 1px)),
        #fff;
      position: relative;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
      touch-action: none;
    }

    .ghost-char {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      pointer-events: none;
      color: rgba(31, 37, 40, 0.12);
      font-family: "KaiTi", "STKaiti", serif;
      font-size: clamp(150px, 35vw, 320px);
      line-height: 1;
    }

    .write-tools {
      display: flex;
      gap: 10px;
      padding: 12px;
      border-top: 1px solid var(--line);
      background: rgba(255,255,255,0.78);
    }

    .progress-bar {
      height: 12px;
      overflow: hidden;
      background: #edf1f0;
      border-radius: 999px;
    }

    .progress-fill {
      height: 100%;
      width: 0;
      background: linear-gradient(90deg, var(--jade), var(--sun));
      border-radius: inherit;
      transition: width 220ms ease;
    }

    .radical-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .radical {
      min-width: 40px;
      min-height: 40px;
      display: grid;
      place-items: center;
      border-radius: 8px;
      background: #fff;
      border: 1px solid var(--line);
      font-weight: 900;
      color: var(--sky);
    }

    @media (max-width: 900px) {
      .app {
        grid-template-columns: 1fr;
      }

      .sidebar {
        min-height: auto;
        position: static;
        border-right: 0;
        border-bottom: 1px solid rgba(31, 37, 40, 0.1);
      }

      .nav {
        grid-template-columns: repeat(4, minmax(0, 1fr));
      }

      .nav button {
        justify-content: center;
        padding: 0 8px;
      }

      .learn-layout,
      .write-layout {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 620px) {
      main {
        padding: 16px;
      }

      .topbar {
        display: block;
      }

      .date-chip {
        display: inline-flex;
        margin-top: 12px;
      }

      .big-card,
      .quiz-prompt {
        grid-template-columns: 1fr;
      }

      .character-box,
      .quiz-char {
        width: min(100%, 220px);
        margin: 0 auto;
      }

      .choices,
      .shape-options,
      .stats {
        grid-template-columns: 1fr;
      }

      .shape-stage {
        grid-template-columns: 1fr;
      }
    }
  
    /* Particles */
    #particle-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 9999;
    }

</style>
</head>
<body>
  <canvas id="particle-canvas"></canvas>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <div class="seal">字</div>
        <div>
          <h1>汉字小书房</h1>
          <p>三年级生字练习</p>
        </div>
      </div>

      <nav class="nav" aria-label="练习模式">
        <button class="active" data-view="learn" title="学习卡">学</button>
        <button data-view="library" title="字库">库</button>
        <button data-view="quiz" title="小测验">测</button>
        <button data-view="write" title="偏旁部首">旁</button>
      </nav>

      <div class="stats">
        <div class="stat">
          <strong id="learnedCount">0</strong>
          <span>已掌握</span>
        </div>
        <div class="stat">
          <strong id="scoreCount">0</strong>
          <span>答对题</span>
        </div>
      </div>

      <div class="filters">
        <div class="field">
          <label for="search">查字</label>
          <input id="search" type="search" placeholder="汉字、拼音、词语">
        </div>
        <div class="field">
          <label for="unit">单元</label>
          <select id="unit">
            <option value="all">全部</option>
          </select>
        </div>
        <div class="progress-bar" aria-label="学习进度">
          <div class="progress-fill" id="progressFill"></div>
        </div>
      </div>
    </aside>

    <main>
      <section class="topbar">
        <div>
          <h2 id="viewTitle">今天学 6 个字</h2>
          <p id="viewSubtitle">看字形、读拼音、记意思，再做一道小测验。</p>
        </div>
        <div class="date-chip" id="dailyChip">第 1 组</div>
      </section>

      <section class="panel active" id="learnPanel">
        <div class="learn-layout">
          <article class="hanzi-stage">
            <div class="stage-art" aria-hidden="true"></div>
            <div class="big-card">
              <div class="character-box">
                <div class="character" id="mainChar">晨</div>
              </div>
              <div class="hanzi-info">
                <h3 id="mainWord">晨</h3>
                <div class="pinyin" id="mainPinyin">chén</div>
                <div class="meaning" id="mainMeaning">早晨，太阳刚出来前后的一段时间。</div>
                <div class="tag-row" id="mainTags"></div>
                <div class="actions">
                  <button class="primary" id="speakBtn">读音</button>
                  <button class="ghost" id="prevBtn" title="上一个">←</button>
                  <button class="ghost" id="nextBtn" title="下一个">→</button>
                  <button class="ghost" id="knownBtn">掌握</button>
                </div>
              </div>
            </div>
          </article>

          <div class="detail-grid">
            <section class="box">
              <h3>组词</h3>
              <ul class="word-list" id="wordList"></ul>
            </section>
            <section class="box">
              <h3>句子</h3>
              <ul class="sentence-list" id="sentenceList"></ul>
            </section>
            <section class="box">
              <h3>偏旁</h3>
              <div class="radical-list" id="radicalList"></div>
            </section>
          </div>
        </div>
      </section>

      <section class="panel" id="libraryPanel">
        <div class="grid" id="charGrid"></div>
      </section>

      <section class="panel" id="quizPanel">
        <article class="quiz-card">
          <div class="mode-tabs" aria-label="题型">
            <button class="active" data-quiz-mode="pinyin">拼音</button>
            <button data-quiz-mode="meaning">意思</button>
            <button data-quiz-mode="word">组词</button>
          </div>
          <div class="quiz-prompt">
            <div class="quiz-char" id="quizChar">晨</div>
            <div>
              <h3 id="quizQuestion">这个字的拼音是？</h3>
              <div class="tag-row">
                <span class="tag" id="quizUnit">第一单元</span>
                <span class="tag" id="quizScore">0 / 0</span>
              </div>
            </div>
          </div>
          <div class="choices" id="choices"></div>

    const state = {
      index: 0,

    function saveProgress() {
      localStorage.setItem("hanzi.learned", JSON.stringify([...state.learned]));
      localStorage.setItem("hanzi.score", String(state.score));
      localStorage.setItem("hanzi.attempts", String(state.attempts));

    function currentList() {
      const keyword = $("search").value.trim().toLowerCase();
      const unit = $("unit").value;
      return hanzi.filter(item => {
        const haystack = [item.char, item.pinyin, item.unit, item.meaning, ...item.words].join(" ").toLowerCase();
        return (unit === "all" || item.unit === unit) && (!keyword || haystack.includes(keyword));
      });
    }

    function itemAtIndex() {
      state.filtered = currentList();
      if (!state.filtered.length) return hanzi[0];
      state.index = Math.max(0, Math.min(state.index, state.filtered.length - 1));
      return state.filtered[state.index];
    }

    function renderStats() {
      $("learnedCount").textContent = state.learned.size;
      $("scoreCount").textContent = state.score;
      $("progressFill").style.width = `${Math.round((state.learned.size / hanzi.length) * 100)}%`;
    }

    
    // --- AUDIO & PARTICLE SYSTEM ---
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    
    function playTone(freq, type, duration, vol=0.1) {
      if(audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      gain.gain.setValueAtTime(vol, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + duration);
    }

    function playSuccessSound() {
      playTone(523.25, 'sine', 0.1, 0.2); // C5
      setTimeout(() => playTone(659.25, 'sine', 0.1, 0.2), 100); // E5
      setTimeout(() => playTone(783.99, 'sine', 0.2, 0.2), 200); // G5
    }

    function playErrorSound() {
      playTone(150, 'sawtooth', 0.15, 0.1);
      setTimeout(() => playTone(100, 'sawtooth', 0.3, 0.1), 150);
    }

    const canvas = document.getElementById('particle-canvas');
    const ctx = canvas.getContext('2d');
    let particles = [];
    
    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    function createParticles(x, y, isSuccess) {
      const colors = isSuccess ? ['#4ade80', '#22c55e', '#16a34a', '#fbbf24', '#f59e0b'] : ['#ef4444', '#dc2626', '#b91c1c', '#6b7280'];
      const count = isSuccess ? 50 : 20;
      for (let i = 0; i < count; i++) {
        particles.push({
          x: x,
          y: y,
          vx: (Math.random() - 0.5) * (isSuccess ? 15 : 8),
          vy: (Math.random() - 0.5) * (isSuccess ? 15 : 8) - (isSuccess ? 5 : 2),
          size: Math.random() * 6 + 3,
          color: colors[Math.floor(Math.random() * colors.length)],
          life: 1,
          decay: Math.random() * 0.02 + 0.01,
          gravity: isSuccess ? 0.3 : 0.5
        });
      }
    }

    function animateParticles() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      for (let i = particles.length - 1; i >= 0; i--) {
        let p = particles[i];
        p.vy += p.gravity;
        p.x += p.vx;
        p.y += p.vy;
        p.life -= p.decay;
        if (p.life <= 0) {
          particles.splice(i, 1);
        } else {
          ctx.globalAlpha = p.life;
          ctx.fillStyle = p.color;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
          ctx.fill();
        }
      }
      ctx.globalAlpha = 1;
      requestAnimationFrame(animateParticles);
    }
    animateParticles();
    
    function triggerEffect(target, isSuccess) {
       const rect = target.getBoundingClientRect();
       const x = rect.left + rect.width / 2;
       const y = rect.top + rect.height / 2;
       if (isSuccess) {
         playSuccessSound();
         createParticles(x, y, true);
       } else {
         playErrorSound();
         createParticles(x, y, false);
         target.style.transform = "translateX(-10px)";
         setTimeout(() => target.style.transform = "translateX(10px)", 50);
         setTimeout(() => target.style.transform = "translateX(-10px)", 100);
         setTimeout(() => target.style.transform = "translateX(0)", 150);
       }
    }
    // --- END SYSTEM ---

    function renderCard() {
      const item = itemAtIndex();
      const hasMatches = state.filtered.length > 0;
      $("mainChar").textContent = item.char;
      $("mainWord").textContent = item.char;
      $("mainPinyin").textContent = item.pinyin;
      $("mainMeaning").textContent = item.meaning;
      $("dailyChip").textContent = hasMatches ? `${item.unit} · ${state.index + 1}/${state.filtered.length}` : "无匹配 · 先看晨";
      $("mainTags").innerHTML = `<span class="tag">${item.unit}</span><span class="tag">${item.radical} 部</span>`;
      $("wordList").innerHTML = item.words.map(word => `<li>${word}</li>`).join("");
      $("sentenceList").innerHTML = item.sentences.map(sentence => `<li>${sentence}</li>`).join("");
      $("radicalList").innerHTML = [item.radical, ...item.words.map(word => word[0]).filter(char => char !== item.char).slice(0, 5)]
        .map(text => `<span class="radical">${text}</span>`).join("");
      $("knownBtn").textContent = state.learned.has(item.char) ? "已掌握" : "掌握";
      renderShape(item);
      renderStats();
    }

    
    function renderLibrary() {
      const list = currentList();
      const grouped = units
        .map(unit => ({unit, items: list.filter(item => item.unit === unit)}))
        .filter(group => group.items.length);
      
      // Limit to first 200 items in view to avoid freezing
      let totalRendered = 0;
      let html = "";
      for (const group of grouped) {
        if (totalRendered > 300) break;
        const itemsToRender = group.items.slice(0, 300 - totalRendered);
        if (itemsToRender.length > 0) {
          html += `
          <section class="unit-group">
            <h3>${group.unit} ${group.items.length > itemsToRender.length ? '(只显示部分)' : ''}</h3>
            <div class="grid">
              ${itemsToRender.map((item) => `
                <button class="tile ${state.learned.has(item.char) ? "learned" : ""}" data-char-index="${hanzi.indexOf(item)}">
                  <span class="mini-char">${item.char}</span>
                  <span class="mini-pinyin">${item.pinyin}</span>
                </button>
              `).join("")}
            </div>
          </section>`;
          totalRendered += itemsToRender.length;
        }
      }
      
      if (!html && list.length === 0) {
        html = `<div class="box">没有找到这个字，换个关键词试试。</div>`;
      } else if (list.length > 300) {
        html += `<div class="box">为了保证流畅，最多显示前300个字，请使用搜索或选择单元来查找。共有 ${list.length} 个结果。</div>`;
      }
      
      $("charGrid").innerHTML = html;
      document.querySelectorAll("[data-char-index]").forEach(button => {
        button.addEventListener("click", () => {
          const target = hanzi[Number(button.dataset.charIndex)];
          state.filtered = currentList();
          state.index = Math.max(0, state.filtered.findIndex(item => item.char === target.char));
          setView("learn");
          renderCard();
        });
      });
    }


    function renderShape(item = itemAtIndex()) {
      $("shapeChar").textContent = item.char;
      $("shapeChar").classList.add("masked");
      const phrase = item.words && item.words.length > 0 ? `${item.words[0]}的${item.char}` : item.char;
      $("shapePinyin").textContent = item.pinyin;
      $("shapeUnit").textContent = item.unit;
      $("shapeQuestion").textContent = "听拼音，看拼音，先选部首，再按顺序选结构和部件。";
      $("shapeClues").innerHTML = [
        `拼音：${item.pinyin}`,
        "第 1 步：选择部首或主要偏旁。",
        "第 2 步：选择这个字的结构。",
        "后续步骤：按书写顺序选择剩下的部件。"
      ].map(text => `<li>${text}</li>`).join("");
      $("shapeRadicals").innerHTML = [...new Set(hanzi.map(entry => entry.radical))]
        .slice(0, 18)
        .map(text => `<span class="radical">${text}</span>`)
        .join("");
      if (!state.shapeQuiz || state.shapeQuiz.item.char !== item.char) newShapeQuiz(item);
    }

    function newShapeQuiz(item = itemAtIndex(), autoSpeak = false) {
      state.shapeQuiz = { item, steps: makeShapeSteps(item), stepIndex: 0 };
      state.shapeAnswered = false;
      $("shapeChar").textContent = item.char;
      $("shapeChar").classList.add("masked");
      const phrase = item.words && item.words.length > 0 ? `${item.words[0]}的${item.char}` : item.char;
      $("shapePinyin").textContent = item.pinyin;
      $("shapeUnit").textContent = item.unit;
      $("shapeFeedback").textContent = "";
      $("nextShapeBtn").style.display = "none";
      renderShapeStep();
      if (autoSpeak) speakPhrase(item);
    }

    function makeShapeSteps(item) {
      const closeRadicals = hanzi
        .filter(entry => entry.char !== item.char && (entry.unit === item.unit || entry.radical.length === item.radical.length))
        .map(entry => entry.radical);
      const structures = [...new Set(hanzi.map(entry => entry.structure))];
      const remainingParts = removeOne(item.parts, item.radical);
      return [
        {
          kind: "radical",
          label: "先选这个字的部首或偏旁。",
          answer: item.radical,
          options: uniqueOptions(item.radical, closeRadicals, hanzi.map(entry => entry.radical), 4)
        },
        {
          kind: "structure",
          label: "再选这个字的结构。",
          answer: item.structure,
          options: uniqueOptions(item.structure, structures.filter(type => type !== item.structure), structures, 4)
        },
        ...remainingParts.map((part, index) => ({
          kind: "part",
          label: `按书写顺序，选择剩下的第 ${index + 1} 个部件。`,
          answer: part,
          options: makePartOptions(item, part)
        }))
      ];
    }

    function removeOne(parts, target) {
      let removed = false;
      return parts.filter(part => {
        if (!removed && part === target) {
          removed = true;
          return false;
        }
        return true;
      });
    }

    function makePartOptions(item, answer) {
      const preferred = hanzi
        .filter(entry => entry.char !== item.char && (entry.unit === item.unit || entry.structure === item.structure))
        .flatMap(entry => entry.parts);
      const fallback = hanzi.flatMap(entry => entry.parts);
      return uniqueOptions(answer, preferred, fallback, 4);
    }

    function renderShapeStep() {
      const quiz = state.shapeQuiz;
      const step = quiz.steps[quiz.stepIndex];
      state.shapeAnswered = false;
      $("shapeQuestion").textContent = step.label;
      $("shapePrompt").textContent = `第 ${quiz.stepIndex + 1} / ${quiz.steps.length} 步`;
      $("shapeChoices").innerHTML = step.options.map(option => {
        const className = step.kind === "structure" ? "choice text-choice" : "choice";
        return `<button class="${className}">${option}</button>`;
      }).join("");
      document.querySelectorAll("#shapeChoices .choice").forEach(button => {
        button.addEventListener("click", () => chooseShape(button));
      });
    }

    function chooseShape(button) {
      if (state.shapeAnswered) return;
      const quiz = state.shapeQuiz;
      const step = quiz.steps[quiz.stepIndex];
      const correct = button.textContent === step.answer;
      state.attempts += 1;
      if (correct) {
        state.shapeAnswered = true;
        state.score += 1;
        document.querySelectorAll("#shapeChoices .choice").forEach(choice => {
          if (choice.textContent === step.answer) choice.classList.add("correct");
        });
        if (quiz.stepIndex < quiz.steps.length - 1) {
          quiz.stepIndex += 1;
          $("shapeFeedback").textContent = "答对了，继续下一步。";
          window.setTimeout(renderShapeStep, 450);
        } else {
          state.shapeAnswered = true;
          state.learned.add(quiz.item.char);
          $("shapeChar").classList.remove("masked");
          $("shapeFeedback").textContent = `全部答对了：这个字是「${quiz.item.char}」，部首是 ${quiz.item.radical}，结构是 ${quiz.item.structure}。`;
          $("nextShapeBtn").style.display = "";
        }
      } else {
        state.shapeAnswered = true;
        $("shapeChar").classList.remove("masked");
        document.querySelectorAll("#shapeChoices .choice").forEach(choice => {
          if (choice.textContent === step.answer) choice.classList.add("correct");
        });
        $("shapeFeedback").textContent = `选错了。正确答案是 ${step.answer}，这个字是「${quiz.item.char}」。`;
        $("nextShapeBtn").style.display = "";
        button.classList.add("wrong");
      }
      saveProgress();
      renderStats();
    }

    window._currentUtterance = null; // Prevent GC bug on Android
    let zhVoice = null;
    
    // Fallback local TTS
    function speakLocal(text, rate = 0.75) {
      if (!("speechSynthesis" in window)) return;
      speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = "zh-CN";
      utterance.rate = rate;
      if (!zhVoice) {
        const voices = speechSynthesis.getVoices();
        zhVoice = voices.find(v => v.lang.replace('_', '-').toLowerCase().includes("zh-cn")) || 
                  voices.find(v => v.lang.toLowerCase().includes("zh"));
      }
      if (zhVoice) utterance.voice = zhVoice;
      window._currentUtterance = utterance;
      speechSynthesis.speak(utterance);
    }

    // Global audio element to bypass Android/iOS strict autoplay restrictions
    
    // --- 平台探测与统一发音引擎 ---
    const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    
    window._currentUtterance = null;
    let zhVoice = null;
    const globalAudio = new Audio();

    function speakLocal(text, rate) {
      if (!("speechSynthesis" in window)) return;
      speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = "zh-CN";
      utterance.rate = rate;
      if (!zhVoice) {
        const voices = speechSynthesis.getVoices();
        zhVoice = voices.find(v => v.lang.replace('_', '-').toLowerCase().includes("zh-cn")) || 
                  voices.find(v => v.lang.toLowerCase().includes("zh"));
      }
      if (zhVoice) utterance.voice = zhVoice;
      window._currentUtterance = utterance;
      speechSynthesis.speak(utterance);
    }

    function playAudioText(text) {
        if (isIOS) {
            // iOS 强制使用本地引擎同步发音，规避异步 Audio 拦截和缓存 Bug
            speakLocal(text, 0.5); 
        } else {
            // 安卓和 PC 使用百度 Fanyi 连读
            try {
                globalAudio.src = `https://fanyi.baidu.com/gettts?lan=zh&text=${encodeURIComponent(text)}&spd=5&source=web`;
                globalAudio.onended = null;
                globalAudio.onerror = () => speakLocal(text, 0.75);
                globalAudio.play().catch(e => speakLocal(text, 0.75));
            } catch (e) {
                speakLocal(text, 0.75);
            }
        }
    }

    function speak(item = itemAtIndex()) {
      playAudioText(item.char);
    }

    function speakPinyin(item = itemAtIndex()) {
      // 拼音因为某些引擎不支持，传入实际汉字读音最准确
      if (isIOS) {
          const plain = item.pinyin.normalize("NFD").replace(/[̀-ͯ]/g, "");
          speakLocal(plain, 0.45);
      } else {
          playAudioText(item.char);
      }
    }

    function speakPhrase(item = itemAtIndex()) {
      const phrase = item.words && item.words.length > 0 ? `${item.words[0]}的${item.char}` : item.char;
      if (isIOS) {
          speakLocal(phrase, 0.5);
      } else {
          playAudioText(phrase);
      }
    }
    // --- 统一引擎结束 ---

    function setView(view) {
      state.view = view;
      document.querySelectorAll(".nav button").forEach(button => button.classList.toggle("active", button.dataset.view === view));
      document.querySelectorAll(".panel").forEach(panel => panel.classList.remove("active"));
      $(`${view}Panel`).classList.add("active");
      const titles = {
        learn: ["今天学 6 个字", "看字形、读拼音、记意思，再做一道小测验。"],
        library: ["生字库", "按单元查找生字，点开继续学习。"],
        quiz: ["小测验", "拼音、意思、组词三种题型，答完自动记录。"],
        write: ["偏旁部首", "听拼音、看拼音，从相近选项里选部首、结构和部件。"]
      };
      $("viewTitle").textContent = titles[view][0];
      $("viewSubtitle").textContent = titles[view][1];
      if (view === "library") renderLibrary();
      if (view === "quiz") newQuiz();
      if (view === "write") newShapeQuiz(itemAtIndex(), true);
    }

    function shuffle(list) {
      return [...list].sort(() => Math.random() - 0.5);
    }

    function uniqueOptions(answer, preferred, fallback, size = 4) {
      const options = [answer];
      [...preferred, ...fallback].forEach(option => {
        if (option && option !== answer && !options.includes(option) && options.length < size) {
          options.push(option);
        }
      });
      return shuffle(options);
    }

    function newQuiz() {
      const list = currentList();
      const pool = list.length >= 4 ? list : hanzi;
      const item = pool[Math.floor(Math.random() * pool.length)];
      const type = state.quizMode;
      const answer = makeAnswer(item, type);
      const options = makeOptions(item, type, answer);
      state.quiz = { item, type, answer, options };
      state.answered = false;
      $("quizChar").textContent = item.char;
      $("quizQuestion").textContent = {
        pinyin: "这个字的拼音是？",
        meaning: "这个字的意思是？",
        word: `哪个词语能和「${item.char}」正确组词？`
      }[type];
      $("quizUnit").textContent = item.unit;
      $("quizScore").textContent = `${state.score} / ${state.attempts}`;
      $("feedback").textContent = "";
      $("nextQuizBtn").style.display = "none";
      $("choices").innerHTML = options.map(option => `<button class="choice">${option}</button>`).join("");
      document.querySelectorAll("#choices .choice").forEach(button => {
        button.addEventListener("click", () => chooseAnswer(button));
      });
    }

    function makeAnswer(item, type) {
      if (type === "pinyin") return item.pinyin;
      if (type === "meaning") return item.meaning;
      const compactWords = item.words.filter(word => word.length === 2);
      const wordPool = compactWords.length ? compactWords : item.words;
      return wordPool[Math.floor(Math.random() * wordPool.length)];
    }

    function makeOptions(item, type, answer) {
      if (type === "pinyin") {
        const sameTone = hanzi.filter(entry => entry.char !== item.char && entry.pinyin.slice(-1) === item.pinyin.slice(-1)).map(entry => entry.pinyin);
        return uniqueOptions(answer, sameTone, hanzi.map(entry => entry.pinyin), 4);
      }
      if (type === "meaning") {
        const closeMeanings = hanzi.filter(entry => entry.char !== item.char && entry.unit === item.unit).map(entry => entry.meaning);
        return uniqueOptions(answer, closeMeanings, hanzi.map(entry => entry.meaning), 4);
      }
      return makeWordOptions(item, answer);
    }

    function makeWordOptions(item, answer) {
      const target = item.char;
      const correctWords = new Set(item.words);
      const sourceWords = hanzi
        .filter(entry => entry.char !== item.char && entry.unit === item.unit)
        .flatMap(entry => entry.words)
        .filter(word => word.length === answer.length);
      const radicalWords = hanzi
        .filter(entry => entry.char !== item.char && entry.radical === item.radical)
        .flatMap(entry => entry.words)
        .filter(word => word.length === answer.length);
      const allWords = hanzi.flatMap(entry => entry.words).filter(word => word.length === answer.length);
      const foils = [...sourceWords, ...radicalWords, ...allWords]
        .map(word => injectTargetChar(word, target, answer.indexOf(target)))
        .filter(word => word && word.includes(target) && word !== answer && !correctWords.has(word));
      const fallback = makeTargetWordFoils(target, answer, correctWords);
      return uniqueOptions(answer, foils, fallback, 4);
    }

    function injectTargetChar(word, target, preferredIndex) {
      if (!word || word.includes(target)) return "";
      const chars = [...word];
      const index = Math.max(0, Math.min(preferredIndex, chars.length - 1));
      chars[index] = target;
      return chars.join("");
    }

    function makeTargetWordFoils(target, answer, correctWords) {
      const before = ["小","大","新","老","白","红","青","明","清","飞","云","风","花","山","水","书","心","手","口","雨"];
      const after = ["子","头","声","光","气","花","风","山","水","心","手","口","门","路","图","本","台","园","面","点"];
      const targetIndex = Math.max(0, answer.indexOf(target));
      const candidates = targetIndex === 0
        ? after.map(char => `${target}${char}`)
        : before.map(char => `${char}${target}`);
      return candidates.filter(word => word !== answer && !correctWords.has(word));
    }

    function chooseAnswer(button) {
      if (state.answered) return;
      state.answered = true;
      const correct = button.textContent === state.quiz.answer;
      state.attempts += 1;
      if (correct) {
        state.score += 1;
        state.learned.add(state.quiz.item.char);
        $("feedback").textContent = `答对了：${state.quiz.item.char}，${state.quiz.item.pinyin}`;
      } else {
        $("feedback").textContent = `再记一下：正确答案是 ${state.quiz.answer}`;
      }
      document.querySelectorAll("#choices .choice").forEach(choice => {
        if (choice.textContent === state.quiz.answer) choice.classList.add("correct");
      });
      if (!correct) button.classList.add("wrong");
      $("nextQuizBtn").style.display = "";
      saveProgress();
      renderStats();
      $("quizScore").textContent = `${state.score} / ${state.attempts}`;
    }

    document.querySelectorAll(".nav button").forEach(button => button.addEventListener("click", () => setView(button.dataset.view)));
    document.querySelectorAll("[data-quiz-mode]").forEach(button => {
      button.addEventListener("click", () => {
        state.quizMode = button.dataset.quizMode;
        document.querySelectorAll("[data-quiz-mode]").forEach(tab => tab.classList.toggle("active", tab === button));
        newQuiz();
      });
    });
    $("search").addEventListener("input", () => { state.index = 0; renderCard(); renderLibrary(); });
    $("unit").addEventListener("change", () => { state.index = 0; renderCard(); renderLibrary(); });
    $("prevBtn").addEventListener("click", () => {
      const length = currentList().length;
      if (!length) return;
      state.index = (state.index - 1 + length) % length;
      renderCard();
    });
    $("nextBtn").addEventListener("click", () => {
      const length = currentList().length;
      if (!length) return;
      state.index = (state.index + 1) % length;
      renderCard();
    });
    $("knownBtn").addEventListener("click", () => {
      const item = itemAtIndex();
      state.learned.has(item.char) ? state.learned.delete(item.char) : state.learned.add(item.char);
      saveProgress();
      renderCard();
      renderLibrary();
    });
    $("speakBtn").addEventListener("click", () => speak());
    $("listenQuizBtn").addEventListener("click", () => state.quiz && speak(state.quiz.item));
    $("nextQuizBtn").addEventListener("click", newQuiz);
    $("listenShapeBtn").addEventListener("click", () => state.shapeQuiz && speakPhrase(state.shapeQuiz.item));
    $("nextShapeBtn").addEventListener("click", () => {
      const length = currentList().length;
      if (length) state.index = (state.index + 1) % length;
      newShapeQuiz(itemAtIndex(), true);
      renderCard();
    });

    renderCard();
    renderLibrary();
  </script>
</body>
</html>
